# LLM Excel Processor 配置示例

# 任务基本信息
task:
  name: "示例处理任务"
  description: "这是一个示例配置文件"
  task_id: null  # 自动生成

# 输入配置
input:
  file: "input/data.xlsx"
  sheet: "Sheet1"  # Excel专用，sheet名称或索引
  encoding: "utf-8"  # CSV/TXT专用
  skip_rows: []  # 要跳过的行号列表
  columns: []  # 要处理的列，为空表示所有列

  # 数据过滤（可选）
  filter:
    enabled: false
    column: "status"
    operator: "equals"  # equals, not_equals, contains, greater_than, less_than
    value: "pending"

# 处理配置
processing:
  mode: "row"  # row: 逐行处理, batch: 批量处理, stream: 流式处理
  batch_size: 10  # batch模式专用

  # 要传递给LLM的列
  input_columns:
    - "text"
    - "category"

  # 列名映射（可选）
  column_mapping:
    text: "content"
    category: "type"

  # 并发配置
  concurrent: false
  max_workers: 5

# LLM配置
llm:
  provider: "openai"  # openai, claude, qwen, ernie, local
  model: "gpt-4"
  temperature: 0.3
  max_tokens: 1000
  top_p: 1.0
  frequency_penalty: 0.0
  presence_penalty: 0.0

  # API配置
  api_key: "${OPENAI_API_KEY}"  # 从环境变量读取
  base_url: null  # 可选，自定义API端点
  timeout: 30

  # 提示词配置
  prompt_template: |
    请分析以下数据：

    内容: {text}
    类别: {category}

    返回JSON格式结果。

  system_prompt: "你是一个专业的数据分析助手。"

  # Few-shot示例
  few_shot_examples: []

  # 输出格式
  output_format: "json"

# 输出配置
output:
  file: "output/result.xlsx"
  format: "xlsx"  # xlsx, csv, json

  # 输出列配置
  columns:
    - "original_text"
    - "analysis_result"
    - "confidence"

  # 是否包含原始数据
  include_original: true

  # 是否包含LLM原始响应
  include_raw_response: false

  # 是否包含元数据（token使用量等）
  include_metadata: true

# 错误处理和重试
retry:
  enabled: true
  max_attempts: 3
  backoff_factor: 2  # 指数退避因子
  timeout: 30

  # 可重试的错误类型
  retryable_errors:
    - "rate_limit"
    - "timeout"
    - "server_error"

# 进度和日志
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/processing.log"
  console: true

  # 结构化日志
  structured: false
  format: "%(asctime)s - %(levelname)s - %(message)s"

# 缓存配置
cache:
  enabled: true
  ttl: 3600  # 秒
  cache_dir: ".cache"

# 成本控制
cost_control:
  enabled: false
  max_tokens_total: 100000
  max_cost_usd: 10.0
  alert_threshold: 0.8  # 达到80%时警告

# 通知配置（可选）
notifications:
  enabled: false

  # Webhook通知
  webhook:
    url: "https://your-webhook-url.com"
    on_complete: true
    on_error: true

  # Email通知
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    from: "noreply@example.com"
    to: ["admin@example.com"]
    on_complete: true
    on_error: true

# 高级配置
advanced:
  # 断点续传
  resume_from: null  # 行号，从指定行继续处理

  # 采样处理（用于测试）
  sample_size: null  # 只处理前N行

  # 数据验证
  validate_input: true
  validate_output: true

  # 临时文件
  temp_dir: "temp"
  auto_cleanup: true
